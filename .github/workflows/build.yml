name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout SpeedrunToolkit
        uses: actions/checkout@v4
        with:
          path: mod

      - name: Clone HitmanAbsolutionSDK
        run: git clone --depth 1 --recurse-submodules https://github.com/pavledev/HitmanAbsolutionSDK.git sdk

      - name: Place mod into SDK
        shell: pwsh
        run: Copy-Item -Recurse mod sdk/Mods/SpeedrunToolkit

      - name: Add SpeedrunToolkit to SDK MODS list
        shell: pwsh
        run: |
          $path = "sdk/CMakeLists.txt"
          $txt  = Get-Content $path -Raw
          $txt  = $txt -replace '(set\(MODS\s*\r?\n)', "`$1    SpeedrunToolkit`n"
          Set-Content $path $txt -NoNewline

      - name: Patch SDK Logger.cpp (missing chrono include for MSVC 19.44+)
        shell: pwsh
        run: |
          $path = "sdk/HitmanAbsolutionSDK/src/Logger.cpp"
          $txt  = Get-Content $path -Raw
          if (-not ($txt -match '#include <chrono>')) {
            $txt = "#include <chrono>`n" + $txt
            Set-Content $path $txt -NoNewline
          }

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git sdk/vcpkg
          .\sdk\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Configure CMake (x86 / Win32)
        shell: pwsh
        run: |
          cmake -S sdk -B build `
            -G "Visual Studio 17 2022" -A Win32 `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/sdk/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x86-windows

      # Build the proxy loader (becomes dinput8.dll) and our mod.
      - name: Build DirectInputProxy + SpeedrunToolkit
        run: cmake --build build --config Release --target DirectInputProxy SpeedrunToolkit

      # ---- Package everything the user needs ----

      - name: Assemble release package
        shell: pwsh
        run: |
          $pkg = "package"
          New-Item -ItemType Directory -Force $pkg | Out-Null
          New-Item -ItemType Directory -Force "$pkg/mods" | Out-Null

          # dinput8.dll — the proxy loader built from DirectInputProxy.
          # The SDK's CMakeLists names the output dinput8.dll.
          $proxy = Get-ChildItem -Recurse -Filter "dinput8.dll" build | Select-Object -First 1
          if (-not $proxy) {
            # Fallback: find by project name if output name differs.
            $proxy = Get-ChildItem -Recurse -Filter "DirectInputProxy.dll" build | Select-Object -First 1
            if ($proxy) { Copy-Item $proxy.FullName "$pkg/dinput8.dll" }
          } else {
            Copy-Item $proxy.FullName "$pkg/dinput8.dll"
          }

          # dinput8_original.dll — the real Windows DirectInput DLL (32-bit).
          # SysWOW64 holds 32-bit DLLs on 64-bit Windows.
          Copy-Item "C:\Windows\SysWOW64\dinput8.dll" "$pkg/dinput8_original.dll"

          # SpeedrunToolkit.dll
          $mod = Get-ChildItem -Recurse -Filter "SpeedrunToolkit.dll" build | Select-Object -First 1
          Copy-Item $mod.FullName "$pkg/mods/SpeedrunToolkit.dll"

          # mods.ini — tells the loader which mods to enable.
          Set-Content "$pkg/mods/mods.ini" "SpeedrunToolkit"

          # List what we packaged.
          Get-ChildItem -Recurse $pkg

      - name: Zip package
        shell: pwsh
        run: Compress-Archive -Path package/* -DestinationPath SpeedrunToolkit.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeedrunToolkit-${{ github.sha }}
          path: SpeedrunToolkit.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: SpeedrunToolkit.zip
          body: |
            ## Installation — extrahera och spela

            1. Ladda ner `SpeedrunToolkit.zip` nedan.
            2. Hitta Hitman Absolutions spelkatalog i Steam:
               högerklicka på spelet → Hantera → Bläddra bland lokala filer.
            3. Extrahera **innehållet** i zip-filen direkt till spelkatalogen
               (inte zip-filen i sig — innehållet).

            Klart. Starta spelet, tryck **`~`** för att öppna SDK-panelen,
            sedan **`L`** för Speedrun Toolkit.

            ---
            Paketet innehåller:
            - `dinput8.dll` — mod-loadern
            - `dinput8_original.dll` — originalt DirectInput (32-bit Windows)
            - `mods/SpeedrunToolkit.dll` — Speedrun Toolkit
            - `mods/mods.ini` — konfiguration

            Se [INSTALL.md](INSTALL.md) för fullständig guide och tangentbordslayout.
