name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
    # A README edit has no reason to spend twenty minutes compiling C++. The
    # workflow itself is deliberately not ignored: a change to it should prove
    # itself by running.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:

env:
  # MSVC 14.40 made std::mutex's constructor constexpr, and a binary built with
  # it reads a null pointer inside std::mutex::lock when it runs against a
  # Visual C++ redistributable older than 14.40. Plenty of machines still carry
  # the 2015 one.
  #
  # This matters here: the mod owns a std::thread and several std::mutex, and
  # DirectXTK takes one behind everything the SDK draws. The failure lands deep
  # inside somebody else's code with nothing of ours on the stack, so it is not
  # a thing to leave a player to diagnose.
  #
  # cl.exe reads CL for extra options, which is how this reaches vcpkg's own
  # build of DirectXTK as well as our target. A CMake flag would not.
  CL: /D_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: mod

      - name: Clone HitmanAbsolutionSDK
        run: git clone --depth 1 --recurse-submodules https://github.com/pavledev/HitmanAbsolutionSDK.git sdk

      # The clone tracks master, so "the SDK" is a moving target. Recording
      # which commit these DLLs were built against is what makes a bug report
      # about them answerable.
      - name: Record SDK revision
        shell: pwsh
        run: |
          $sha = (git -C sdk rev-parse HEAD).Trim()
          Write-Host "SDK commit: $sha"
          "SDK_COMMIT=$sha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Each mod is a self-contained folder in the SDK's Mods tree, with the
      # shared code copied in as <mod>/common, which is what its CMakeLists
      # globs.
      - name: Place the mod into the SDK tree
        shell: pwsh
        run: |
          Copy-Item -Recurse "mod/mods/Coop" "sdk/Mods/Coop"
          Copy-Item -Recurse "mod/common"    "sdk/Mods/Coop/common"

      - name: Add Coop to the SDK MODS list
        shell: pwsh
        run: |
          $path = "sdk/CMakeLists.txt"
          $txt  = Get-Content $path -Raw
          $txt  = $txt -replace '(set\(MODS\s*\r?\n)', "`$1    Coop`n"
          Set-Content $path $txt -NoNewline

      - name: Patch SDK Logger.cpp (missing chrono include for MSVC 19.44+)
        shell: pwsh
        run: |
          $path = "sdk/HitmanAbsolutionSDK/src/Logger.cpp"
          $txt  = Get-Content $path -Raw
          if (-not ($txt -match '#include <chrono>')) {
            $txt = "#include <chrono>`n" + $txt
            Set-Content $path $txt -NoNewline
          }

      # We deliberately ship without assets/HashMap.txt - 28 MB of hash-to-path
      # table that nothing here looks anything up in - and the SDK reports its
      # absence at ERROR, which in an otherwise clean log reads as something
      # being broken. ResourceIDRegistry::Load already handles the file being
      # missing. Same sentence, quieter level.
      - name: Patch SDK ResourceIDRegistry (do not shout about a file we omit)
        shell: pwsh
        run: |
          $path = "sdk/HitmanAbsolutionSDK/src/Registry/ResourceIDRegistry.cpp"
          $txt  = Get-Content $path -Raw
          $from = 'Logger::Level::Error, "Failed to open HashMap.txt!"'
          $to   = 'Logger::Level::Info, "HashMap.txt is not installed - resource names stay as hashes. This is expected."'

          if (-not $txt.Contains($from)) {
            throw "ResourceIDRegistry.cpp no longer logs what this patch expects - check it before shipping"
          }

          Set-Content $path $txt.Replace($from, $to) -NoNewline

      # The menu bar the loader draws across the top of the screen opened with
      # "Hitman Absolution SDK" in bold and the SDK's own MODS and Settings
      # buttons, before any of the mods somebody actually installed. That, and
      # the magenta the whole interface is themed in, are what this changes.
      # Presentation only - nothing here alters what any of it does.
      - name: Patch SDK appearance (see .github/scripts/patch-sdk-appearance.ps1)
        shell: pwsh
        run: .\mod\.github\scripts\patch-sdk-appearance.ps1 -SdkRoot sdk

      # Three defects in the SDK and its loader, all found by whoever debugged
      # the "click Play four times before it starts" problem. The important one
      # is the proxy calling LoadLibrary from DllMain, which is forbidden: the
      # loader lock is held for the duration of DllMain and LoadLibrary wants
      # the same lock. Most of the time the loader untangles it. The rest of the
      # time the game never finishes starting, and the SDK never appears.
      #
      # The script asserts the SDK still looks the way each patch expects and
      # fails the build rather than silently doing nothing.
      - name: Patch SDK startup (see .github/scripts/patch-sdk-startup.ps1)
        shell: pwsh
        run: .\mod\.github\scripts\patch-sdk-startup.ps1 -SdkRoot sdk

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git sdk/vcpkg
          .\sdk\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      # /MAP makes the linker emit a symbol map next to the DLL. Crash reports
      # from players are raw "module+0xRVA" offsets, and without a map there is
      # no way to turn one back into a function name.
      - name: Configure CMake (x86 / Win32)
        shell: pwsh
        run: |
          cmake -S sdk -B build `
            -G "Visual Studio 17 2022" -A Win32 `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/sdk/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x86-windows `
            -DCMAKE_SHARED_LINKER_FLAGS="/MAP /MAPINFO:EXPORTS"

      - name: Build
        run: cmake --build build --config Release --target DirectInputProxy HitmanAbsolutionSDK Coop

      # ---- Package ----------------------------------------------------------
      #
      # Three things an earlier version of this got wrong, each of which alone
      # meant nothing loaded:
      #
      #   1. mods.ini went to mods\. ModManager::LoadAllMods reads it from the
      #      process working directory, which is the game root.
      #   2. It was a plain list of names. LoadAllMods walks the ini's
      #      *sections*, so a mod has to appear as [Name].
      #   3. Only the proxy and the mod shipped. HitmanAbsolutionSDK.dll, which
      #      the proxy exists to load, was not in the archive at all.

      - name: Assemble package
        shell: pwsh
        run: |
          $pkg = "package"
          New-Item -ItemType Directory -Force $pkg | Out-Null
          New-Item -ItemType Directory -Force "$pkg/mods" | Out-Null

          function CopyBuilt($pattern, $destination, $required) {
            $file = Get-ChildItem -Recurse -Filter $pattern build -ErrorAction SilentlyContinue |
                    Select-Object -First 1
            if (-not $file) {
              if ($required) { throw "$pattern not found in build output" }
              Write-Host "optional: $pattern not present, skipping"
              return
            }
            Copy-Item $file.FullName $destination
            Write-Host "packaged $($file.Name)"
          }

          # The proxy loader. The SDK names its output dinput8.dll; fall back to
          # the project name in case that changes upstream.
          $proxy = Get-ChildItem -Recurse -Filter "dinput8.dll" build -ErrorAction SilentlyContinue |
                   Select-Object -First 1
          if ($proxy) {
            Copy-Item $proxy.FullName "$pkg/dinput8.dll"
          } else {
            CopyBuilt "DirectInputProxy.dll" "$pkg/dinput8.dll" $true
          }

          # The real DirectInput, which the proxy forwards everything to.
          Copy-Item "C:\Windows\SysWOW64\dinput8.dll" "$pkg/dinput8_original.dll"

          CopyBuilt "HitmanAbsolutionSDK.dll" "$pkg/" $true
          CopyBuilt "DirectXTK.dll"           "$pkg/" $false
          CopyBuilt "minhook.x32.dll"         "$pkg/" $false

          # vcpkg leaves shared dependencies in its own bin directory rather
          # than in the build tree.
          $vcpkgBin = "build/vcpkg_installed/x86-windows/bin"
          if (Test-Path $vcpkgBin) {
            Get-ChildItem "$vcpkgBin/*.dll" | ForEach-Object {
              if (-not (Test-Path "$pkg/$($_.Name)")) {
                Copy-Item $_.FullName "$pkg/"
                Write-Host "packaged $($_.Name) from vcpkg"
              }
            }
          }

          CopyBuilt "Coop.dll" "$pkg/mods/" $true
          Copy-Item "mod/mods/Coop/Coop.ini" "$pkg/mods/Coop.ini"

          # Fonts and icons the overlay draws with, plus the property and enum
          # registries. HashMap.txt is left out deliberately: it is 200k
          # resource names, the SDK handles its absence, and it doubles the
          # download.
          if (Test-Path "sdk/assets") {
            New-Item -ItemType Directory -Force "$pkg/assets" | Out-Null
            Copy-Item -Recurse "sdk/assets/*" "$pkg/assets/" -Exclude "HashMap.txt"
          }

          # Game root, one ini section per mod.
          Set-Content "$pkg/mods.ini" "[Coop]`n" -NoNewline

          Get-ChildItem -Recurse $pkg | Select-Object FullName

      - name: Zip package
        shell: pwsh
        run: Compress-Archive -Path package/* -DestinationPath AbsolutionCoop.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AbsolutionCoop-${{ github.sha }}
          path: AbsolutionCoop.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: AbsolutionCoop.zip
          body: |
            ## Install

            Extract the contents of `AbsolutionCoop.zip` into the folder
            `HMA.exe` lives in, so that `dinput8.dll` and `mods.ini` end up
            next to it.

            - Steam: right-click the game, Manage, Browse local files
            - GOG: `...\Hitman Absolution\retail\`

            Start the game. `~` opens the SDK panel, `F6` opens co-op.

            ## Playing

            One player hosts, and only the host needs a reachable UDP port.
            Everyone else types the host's `address:port`.

            NPCs are not shared. Two people in the same room see the same level
            and different guards.

            Built against HitmanAbsolutionSDK `${{ env.SDK_COMMIT }}`.
            Needs 1.0.447.0 and the 32-bit Visual C++ 2015-2022 redistributable.
            Do not use it in Contracts.
