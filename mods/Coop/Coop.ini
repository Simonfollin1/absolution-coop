; Absolution Co-op - keybinds.
;
; This file must sit in <game folder>/mods/ next to Coop.dll.
;
; A single key is written on its own; add modifiers with '+' (lctrl+f6) and
; separate alternatives with ',' (f6,k). Key names are the engine's own:
; f1-f15, a-z, 0-9, left, right, up, down, pgup, pgdn, home, end, ins, del,
; space, tab, return, lctrl, lshift, lalt and the right-hand versions.
;
; Set EnableBindings to false to turn the whole set off and reach the panel
; from the SDK's own menu instead (the key left of 1, then Co-op).
;
; Worth knowing before you decide a key is broken: none of these work while
; the SDK's interface has focus, because the SDK switches the game's input off
; whenever it holds the keyboard. Close it first.

[Bindings]
EnableBindings = true

; Opens the co-op panel and takes the cursor with it. Close it with the key
; left of 1, or with the window's own X - this one only opens, because it can
; only ever be pressed while the panel is not on screen anyway.
CoopToggle = f6

; Two jobs, both "yes": get up now while you are down, and accept being pulled
; forward when somebody opens the way ahead.
CoopFollow = f7

; Drops a marker where you are standing. Everyone in the session sees it for
; twenty seconds.
CoopMarker = f8

; Spectator camera, while you are down. These are bound as held rather than
; tapped, so leaning on one keeps the camera moving.
CoopSpectateLeft    = left
CoopSpectateRight   = right
CoopSpectateUp      = up
CoopSpectateDown    = down
CoopSpectateCloser  = pgup
CoopSpectateFurther = pgdn
