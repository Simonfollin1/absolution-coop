; Absolution Co-op - keybinds.
;
; Loaded from mods\Coop.ini before OnEngineInitialized runs. A single key
; compiles to tap(kb,<key>); a '+' adds modifiers (lctrl+f6); a ',' separates
; alternatives.
;
; Set EnableBindings to false to turn the whole set off and reach the panel
; from the SDK's own menu instead (tilde, then Co-op).

[Bindings]
EnableBindings = true

; Opens and closes the co-op panel.
CoopToggle = f6

; When somebody opens the way ahead, this is "yes, take me". Only does
; anything while a move is pending, and only matters if you have set moving
; through the level to "Ask me first" - on the default the grace period runs
; out by itself.
CoopFollow = f7

; Drops a marker where you are standing. Everyone in the session sees it for
; twenty seconds.
CoopMarker = f8

; Spectator camera, while you are down. Held rather than tapped.
CoopSpectateLeft    = left
CoopSpectateRight   = right
CoopSpectateUp      = up
CoopSpectateDown    = down
CoopSpectateCloser  = pgup
CoopSpectateFurther = pgdn
